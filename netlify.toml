[build]
  publish = "."
  functions = "netlify/functions"
  command = "node scripts/build.mjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["content/*.json"]

# Pretty URL for the client portal
[[redirects]]
  from = "/updates"
  to = "/updates.html"
  status = 200

# Clean URLs
[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200
[[redirects]]
  from = "/market"
  to = "/market.html"
  status = 200
[[redirects]]
  from = "/catering"
  to = "/catering.html"
  status = 200
[[redirects]]
  from = "/locations"
  to = "/locations.html"
  status = 200
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Old WordPress paths on zamanigrill.com
[[redirects]]
  from = "/menus/*"
  to = "/menu"
  status = 301
[[redirects]]
  from = "/hours"
  to = "/tx/spring/louetta/"
  status = 301
[[redirects]]
  from = "/hours/"
  to = "/tx/spring/louetta/"
  status = 301
[[redirects]]
  from = "/reviews"
  to = "/tx/spring/louetta/#reviews"
  status = 301
[[redirects]]
  from = "/reviews/"
  to = "/tx/spring/louetta/#reviews"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/locations"
  status = 301
[[redirects]]
  from = "/contact-us/"
  to = "/locations"
  status = 301
[[redirects]]
  from = "/spring"
  to = "/tx/spring/louetta/"
  status = 301
[[redirects]]
  from = "/spring/*"
  to = "/tx/spring/louetta/"
  status = 301
[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

# zamani2market.com → the Riley Fuzzel location page (add the domain as an alias in Netlify first)
[[redirects]]
  from = "https://zamani2market.com/*"
  to = "https://zamanigrill.com/tx/spring/riley-fuzzel/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.zamani2market.com/*"
  to = "https://zamanigrill.com/tx/spring/riley-fuzzel/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fingerprinted assets can be cached hard; HTML must not be.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
