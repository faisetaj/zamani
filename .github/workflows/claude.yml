name: Claude site updates

# The agent runs ONLY when @claude is mentioned in an issue comment. New issues from the
# /updates portal deliberately do not mention @claude — the ops panel posts that comment
# after a human approves the request (gate 1). Do not add an `issues: [opened]` trigger
# here; it would run the agent on every raw client submission and defeat the gate.
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: >
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.issue.labels.*.name, 'site-update')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 25"
